# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
# https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-go

name: Go

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.23' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Display Go version
        run: go version

      # - name: Build
      #   run: go build -v ./...

      # - name: Benchmark
      #   run: go test -bench=. -benchtime=1000x -benchmem ./test/benchmark/...

      # - name: Test Masculine
      #   run: go test -v -count=1 -run Masculine .

      # - name: Test Feminine
      #   run: go test -v -count=1 -run Feminine .

      - name: Test
        run: go test -v -count=1 -run Basic -cover ./...
